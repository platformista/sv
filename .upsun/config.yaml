applications:
    sylius:
        type: php:8.4
        source:
          root: "sylius"
        relationships:
            db:
            mercure:
            redis:
        workers:
          queue:
            commands:
              start: |
                sleep infinity
          scheduler:
            commands:
              start: |
                sleep infinity
        mounts:
            "config/jwt":
                source: storage
                source_path: jwt
            "/var/cache":
                source: instance
                source_path: cache
            "/var/log":
                source: instance
                source_path: log
            "/var/sessions":
                source: storage
                source_path: sessions
            "/public/assets":
                source: storage
                source_path: assets
            "/public/bundles":
                source: storage
                source_path: bundles
            "/public/uploads":
                source: storage
                source_path: uploads
            "/public/media":
                source: storage
                source_path: media
        web:
            locations:
                "/":
                    root: "public"
                    passthru: "/index.php"
                    allow: true
                    expires: -1
                    scripts: true
                '/assets/shop':
                    expires: 2w
                    passthru: true
                    allow: false
                    rules:
                        ? '\.(css|js|jpe?g|png|gif|svgz?|ico|bmp|tiff?|wbmp|ico|jng|bmp|html|pdf|otf|woff2|woff|eot|ttf|jar|swf|ogx|avi|wmv|asf|asx|mng|flv|webm|mov|ogv|mpe|mpe?g|mp4|3gpp|weba|ra|m4a|mp3|mp2|mpe?ga|midi?)$'
                        :   allow: true
                '/media/image':
                    expires: 2w
                    passthru: true
                    allow: false
                    rules:
                        '\.(jpe?g|png|gif|svgz?)$':
                            allow: true
                '/media/cache/resolve':
                    passthru: "/index.php"
                    expires: -1
                    allow: true
                    scripts: true
                '/media/cache':
                    expires: 2w
                    passthru: true
                    allow: false
                    rules:
                        '\.(jpe?g|png|gif|svgz?|webp)$':
                            allow: true
        variables:
            env:
                APP_ENV: 'prod'
                APP_DEBUG: 0
                N_PREFIX: /app/.global
        build:
            flavor: composer
        dependencies:
            nodejs:
                n: "*"
                yarn: "*"
            php:
                composer/composer: '^2'
        runtime:
            extensions:
                - sodium
        crons:
            sylius-cancel-unpaid-orders:
                spec: "0 2 * * *"
                cmd: "php bin/console --env=prod sylius:cancel-unpaid-orders"
            sylius-remove-expired-carts:
                spec: "0 2 * * *"
                cmd: "php bin/console --env=prod sylius:remove-expired-carts"
        hooks:
            build: |
                set -e
                n auto
                hash -r
                curl -sS https://get.symfony.com/cli/installer | bash
                mv "$PLATFORM_APP_DIR/.symfony5/bin/symfony" "$PLATFORM_APP_DIR/.global/bin/symfony"
                cat >> "$PLATFORM_APP_DIR/.global/environment" <<EOS
                    export \$(symfony var:export)
                EOS
                yarn install --frozen-lockfile
                yarn build:prod
            deploy: |
                set -e
                rm -rf var/cache/*
                mkdir -p public/media/image
                bin/console doctrine:database:create --if-not-exists
                bin/console doctrine:migrations:migrate -n
                SYLIUS_FIXTURES_HOSTNAME=$SYMFONY_PROJECT_DEFAULT_ROUTE_HOST bin/console sylius:fixtures:load -n
                bin/console lexik:jwt:generate-keypair --skip-if-exists
                bin/console assets:install --symlink --relative public
                bin/console cache:clear
    speedvegas:
      # The runtime the application uses.
      # Complete list of available runtimes: https://docs.platform.sh/create-apps/app-reference.html#types
      type: 'nodejs:18'
      # Mounts define directories that are writable after the build is complete. If set as a local source, disk property is required.
      # More information: https://docs.platform.sh/create-apps/app-reference.html#mounts
      mounts:
        # Next.js will try to cache files, so it must be writeable.
        '/.next':
          source: instance
          source_path: 'next'
      relationships:
        sylius:
      # The web key configures the web server running in front of your app.
      # More information: https://docs.platform.sh/create-apps/app-reference.html#web
      web:
        # Commands are run once after deployment to start the application process.
        # More information: https://docs.platform.sh/create-apps/app-reference.html#web-commands
        commands:
          # The command to launch your app. If it terminates, it’s restarted immediately.
          start: npx next start -p $PORT
      # Specifies a default set of build tasks to run. Flavors are language-specific.
      # More information: https://docs.platform.sh/create-apps/app-reference.html#build
      build:
        flavor: none
      # Installs global dependencies as part of the build process. They’re independent of your app’s dependencies and
      # are available in the PATH during the build process and in the runtime environment. They’re installed before
      # the build hook runs using a package manager for the language.
      # More information: https://docs.platform.sh/create-apps/app-reference.html#dependencies
      dependencies:
        nodejs:
          yarn: "^1.22.0"
      # Hooks allow you to customize your code/environment as the project moves through the build and deploy stages
      # More information: https://docs.platform.sh/create-apps/app-reference.html#hooks
      hooks:
        # The build hook is run after any build flavor.
        # More information: https://docs.platform.sh/create-apps/hooks/hooks-comparison.html#build-hook
        build: |
          yarn
          yarn build
          # Move committed files in soon-to-be mounts into temp directory.
          chmod +x handle_mounts.sh
          ./handle_mounts.sh
        # The deploy hook is run after the app container has been started, but before it has started accepting requests.
        # More information: https://docs.platform.sh/create-apps/hooks/hooks-comparison.html#deploy-hook
        deploy: |
          # Move committed files from temp directory back into mounts.
          ./handle_mounts.sh
      # Information on the app's source code and operations that can be run on it.
      # More information: https://docs.platform.sh/create-apps/app-reference.html#source
      source:
        ######################################################################################################################
        ##                                                                                                                  ##
        ## This source operation is part of the Platform.sh process of updating and maintaining our collection of           ##
        ## templates. For more information see https://docs.platform.sh/create-apps/source-operations.html and              ##
        ## https://github.com/platformsh/source-operations                                                                  ##
        ##                                                                                                                  ##
        ##                  YOU CAN SAFELY DELETE THIS COMMENT AND THE LINES BENEATH IT                                     ##
        ##                                                                                                                  ##
        ######################################################################################################################
        operations:
          auto-update:
            command: |
              curl -fsS https://raw.githubusercontent.com/platformsh/source-operations/main/setup.sh | { bash /dev/fd/3 sop-autoupdate; } 3<&0
        root: speedvegas
