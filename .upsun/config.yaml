services:
    db:
        type: mysql:11.8
    db2:
      type: mysql:11.8
    redis:
      type: redis-persistent:8.0
    mercure:
      type: mercure:0
    gotenberg:
      type: gotenberg:8
routes:
    "https://{default}/":
        type: upstream
        upstream: "sylius:http"
    "https://www.{default}/":
        type: redirect
        to: "https://{default}/"
    "https://speedvegas.{default}/":
      type: upstream
      upstream: "speedvegas:http"
    "https://exotic.{default}/":
      type: upstream
      upstream: "exotic:http"
    "https://karts.{default}/":
      type: upstream
      upstream: "karts:http"
    "https://offroad.{default}/":
      type: upstream
      upstream: "offroad:http"